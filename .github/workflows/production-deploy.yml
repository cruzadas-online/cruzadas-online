name: Deploy Finance App to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cruzadas-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  DEPLOY_HOST: app.admdg.com.br
  DEPLOY_USER: ubuntu
  DEPLOY_PATH: /home/ubuntu/app/finance_app
  SSH_PORT: "22"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/cruzadas.pem
          chmod 600 ~/.ssh/cruzadas.pem
          ssh-keyscan -p "$SSH_PORT" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Create deployment environment file
        shell: bash
        run: |
          printf '%s' "${{ vars.DEPLOY_ENV_BASE64 }}" | base64 --decode > .env
          test -s .env
          printf '\n' >> .env
          env_value() { grep -m1 "^$1=" .env | cut -d= -f2- | tr -d '\r'; }
          if ! grep -q '^DATABASE_PROVIDER=' .env; then
            echo 'DATABASE_PROVIDER=Npgsql' >> .env
          fi
          if ! grep -q '^ConnectionStrings__DefaultConnection=' .env; then
            db_host="$(env_value DATABASE_URL)"
            db_port="$(env_value CRUZADAS_DB_PORT)"
            db_name="$(env_value POSTGRES_DB)"
            db_user="$(env_value POSTGRES_USER)"
            db_pass="$(env_value POSTGRES_PASSWORD)"
            if [ -z "$db_host" ] || [ -z "$db_name" ] || [ -z "$db_user" ] || [ -z "$db_pass" ]; then
              echo 'DEPLOY_ENV_BASE64 must define ConnectionStrings__DefaultConnection (or DATABASE_URL, POSTGRES_DB, POSTGRES_USER and POSTGRES_PASSWORD)' >&2
              exit 1
            fi
            echo "ConnectionStrings__DefaultConnection=Host=$db_host;Port=${db_port:-5432};Database=$db_name;Username=$db_user;Password=$db_pass" >> .env
          fi
          grep -q '^ConnectionStrings__DefaultConnection=' .env
          grep -q '^DATABASE_PROVIDER=Npgsql$' .env

      - name: Synchronize application files
        shell: bash
        run: |
          ssh -p "$SSH_PORT" -i ~/.ssh/cruzadas.pem \
            "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH'"
          rsync -az --delete \
            -e "ssh -p $SSH_PORT -i ~/.ssh/cruzadas.pem" \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "__pycache__" \
            --exclude "*.pyc" \
            --exclude ".DS_Store" \
            --exclude "frontend/node_modules" \
            --exclude "frontend/dist" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          scp -P "$SSH_PORT" -i ~/.ssh/cruzadas.pem .env \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/.env"

      - name: Deploy production containers
        shell: bash
        run: |
          ssh -p "$SSH_PORT" -i ~/.ssh/cruzadas.pem \
            "$DEPLOY_USER@$DEPLOY_HOST" "
              set -eu
              cd '$DEPLOY_PATH'
              sudo docker compose --env-file .env -f docker-compose.production.yml config --quiet
              sudo docker compose --env-file .env -f docker-compose.production.yml up -d --build --remove-orphans --wait --wait-timeout 180
            "

  healthcheck:
    runs-on: ubuntu-latest
    needs: deploy
    environment: production

    steps:
      - name: Check HTTPS API backend
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error --max-time 10 \
              "https://$DEPLOY_HOST/health"; then
              exit 0
            fi
            sleep 2
          done
          exit 1